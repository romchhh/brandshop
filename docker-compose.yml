# Compose V2: `docker compose up -d` (без дефісу).

volumes:
  pgdata_gma:
  redis_data:

networks:
  djangonetwork:
    driver: bridge

services:
  project_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Менше RAM для невеликого магазину
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    # Лише внутрішня мережа — не світити Postgres у світ
    expose:
      - "5432"
    volumes:
      - pgdata_gma:/var/lib/postgresql/data
    networks:
      - djangonetwork
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - djangonetwork
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: django_server
    volumes:
      - ./server:/app
      - ${MEDIA_VOLUME_HOST_PATH:-./server/media}:${DJANGO_MEDIA_ROOT:-/app/media}
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-project_db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PAY_MERCHANT_ID: ${PAY_MERCHANT_ID}
      PAY_SECRET_KEY: ${PAY_SECRET_KEY}
      API_HOST: 'http://localhost:8001'
      BOT_TOKEN: ${TELEGRAM_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_IDS: ${ADMIN_IDS:-}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-3600}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      CELERY_LOGLEVEL: ${CELERY_LOGLEVEL:-warning}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      SHOP_FEED_NAME: ${SHOP_FEED_NAME:-BrandShop}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-}
      API_PUBLIC_CACHE_MAX_AGE: ${API_PUBLIC_CACHE_MAX_AGE:-300}
      DJANGO_CACHE_REDIS_URL: ${DJANGO_CACHE_REDIS_URL:-redis://redis:6379/2}
      API_JSON_CACHE_TTL: ${API_JSON_CACHE_TTL:-300}
    networks:
      - djangonetwork
    depends_on:
      - project_db
      - redis
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    container_name: telegram_bot
    depends_on:
      - server
      - redis
    volumes:
      - ./bot:/app
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_IDS: ${ADMIN_IDS:-}
      SERVER_URL: http://server:8000
    networks:
      - djangonetwork
    restart: unless-stopped

  client:
    build:
      context: ./client-give-me-app
      args:
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost:8000}
        NEXT_PUBLIC_IMAGE_UPSTREAM: ${NEXT_PUBLIC_IMAGE_UPSTREAM:-http://server:8000}
        NEXT_PUBLIC_MEDIA_SAME_ORIGIN: ${NEXT_PUBLIC_MEDIA_SAME_ORIGIN:-1}
        NEXT_PUBLIC_DEV: ${NEXT_PUBLIC_DEV:-0}
    container_name: react_client
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost:8000}
      NEXT_PUBLIC_IMAGE_UPSTREAM: ${NEXT_PUBLIC_IMAGE_UPSTREAM:-http://server:8000}
      NEXT_PUBLIC_MEDIA_SAME_ORIGIN: ${NEXT_PUBLIC_MEDIA_SAME_ORIGIN:-1}
      NEXT_PUBLIC_DEV: ${NEXT_PUBLIC_DEV:-0}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
    volumes:
      - ${MEDIA_VOLUME_HOST_PATH:-./server/media}:/app/public/media
    networks:
      - djangonetwork
    depends_on:
      - server
    restart: unless-stopped
